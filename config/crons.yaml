# ElderBot Cron Configuration
# Single source of truth for all scheduled jobs.
# Bot cannot create new jobs without Jesse's approval via Telegram.
# Full runtime registry lives in src/cron/scheduler.ts

jobs:
  - name: heartbeat
    schedule: "*/30 6-22 * * *"
    description: "Check active sessions, report issues to Telegram"
    enabled: true

  - name: morning-briefing
    schedule: "0 8 * * *"
    description: "Daily status summary → Telegram at 8 AM"
    enabled: true

  - name: nightly-consolidation
    schedule: "0 2 * * *"
    description: "Review day, update memory files, re-index at 2 AM"
    enabled: true

  - name: security-review
    schedule: "0 6 * * *"
    description: "Review security log at 6 AM before morning briefing"
    enabled: true

